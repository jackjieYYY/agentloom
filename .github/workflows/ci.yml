name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.7-bookworm
        env:
          POSTGRES_USER: myagents
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agentloom_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U myagents -d agentloom_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://myagents:ci-only-password@127.0.0.1:5433/agentloom_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Build and PostgreSQL integration tests
        run: pnpm test:integration
      - name: Build images and check container delivery
        run: pnpm exec tsx tests/docker.smoke.ts
